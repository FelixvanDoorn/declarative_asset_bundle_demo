[project]
name = "declarative_asset_bundle_demo"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
    "mlflow>=3.18.0",
]

[project.scripts]
main = "declarative_asset_bundle_demo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
