# This is a Declarative Automation Bundle definition for declarative_asset_bundle_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: declarative_asset_bundle_demo
  uuid: 8a79944a-e78f-4ff0-a9cf-cab0a3c5099f

include:
  - resources/*.yml

# The script agent is a separate bundle (script_agent/); don't upload it with the ETL code.
sync:
  exclude:
    - script_agent/**

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    # Workspace host is not hard-coded: it comes from DATABRICKS_HOST,
    # DATABRICKS_CONFIG_PROFILE, or your DEFAULT profile in ~/.databrickscfg.
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      # Deploy to the deploying identity's home folder so there is only a single copy.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    # No explicit permissions: the deploying identity (the CI service principal) owns the
    # resources, and workspace admins keep CAN_MANAGE implicitly. Hard-coding a user here
    # would break when a service principal deploys (it needs service_principal_name).
