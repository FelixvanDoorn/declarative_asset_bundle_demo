resources:
  apps:
    web_agent:
      name: web-agent
      description: Demo web UI for the LangGraph agent
      source_code_path: ../app
      # The app runs as its own service principal; these grant it access and are passed
      # to the app as environment variables via app.yaml (valueFrom: <name>).
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: databricks-meta-llama-3-3-70b-instruct
            permission: CAN_QUERY
        - name: experiment
          experiment:
            experiment_id: ${resources.experiments.web_agent_traces.id}
            permission: CAN_EDIT
